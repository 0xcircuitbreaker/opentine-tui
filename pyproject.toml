[project]
name = "opentine-tui"
version = "0.2.0"
description = "Terminal dashboard for opentine — visual management console with Textual"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "opentine contributors" }]
keywords = ["agents", "llm", "fork", "replay", "run-tree", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    # 0.2.0 ships .tine format v2: migration, tags+search/index, cost+budget,
    # autosave/drafts, signing (tine-sig/1), and field-level diff — all surfaced
    # by this dashboard.
    "opentine>=0.2,<0.3",
    "textual>=3.0",
]

[project.optional-dependencies]
# Ed25519 signing/keygen in the dashboard (HMAC-SHA256 works without it).
crypto = ["opentine[crypto]>=0.2,<0.3"]
dev = [
    "build>=1.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.scripts]
tine-dashboard = "opentine_tui:main"
opentine-tui = "opentine_tui:main"

[project.urls]
Homepage = "https://opentine.com"
Repository = "https://github.com/0xcircuitbreaker/opentine-tui"
Issues = "https://github.com/0xcircuitbreaker/opentine-tui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
