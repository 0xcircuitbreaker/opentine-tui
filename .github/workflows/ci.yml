name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every version the package advertises in its classifiers is tested here;
        # claiming support for one that never runs is a promise nobody checked.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip

      # opentine resolves from PyPI through the pin in pyproject.toml, so CI tests
      # exactly what a user gets. Tests deliberately do not shadow it with a source
      # checkout; set OPENTINE_SRC locally to work against one.
      - name: Install opentine-tui with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Show resolved dependency versions
        run: python -m pip list

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests -v

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: opentine-tui-dist
          path: dist/opentine_tui-*
          if-no-files-found: error
