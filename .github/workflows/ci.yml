name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # opentine 0.1.1 (with the harness integration the TUI relies on) is not yet on
  # PyPI; install it from source until the release lands. Drop this and rely on the
  # pinned PyPI dependency once opentine>=0.1.1 is published.
  OPENTINE_GIT: "opentine @ git+https://github.com/0xcircuitbreaker/opentine.git@main"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip

      - name: Install opentine from source
        run: python -m pip install "${{ env.OPENTINE_GIT }}"

      - name: Install opentine-tui with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests -v

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: opentine-tui-dist
          path: dist/opentine_tui-*
          if-no-files-found: error
