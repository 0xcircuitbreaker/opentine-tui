name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip

      - name: Install opentine-tui with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run fast gates
        run: |
          ruff check .
          ruff format --check .
          pytest tests -q

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Check package metadata
        run: twine check dist/*

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum opentine_tui-* > SHA256SUMS

      - name: Attest build provenance
        # Build provenance attestation requires a public repository (or GitHub
        # org/enterprise with the feature enabled). Skip it on private repos so the
        # release still publishes; it runs automatically once the repo is public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/opentine_tui-*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentine-tui-release-artifacts
          path: |
            dist/opentine_tui-*
            dist/SHA256SUMS

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/opentine_tui-* dist/SHA256SUMS --verify-tag --generate-notes

  # The README tells people to `pip install opentine-tui`, so a release has to
  # reach PyPI. Until this job existed the workflow only attached artifacts to a
  # GitHub release, which is why PyPI stalled at 0.1.0 while the project moved on.
  #
  # ONE-TIME SETUP, or this job fails the release:
  #   1. On PyPI, add a Trusted Publisher for the `opentine-tui` project:
  #      owner `0xcircuitbreaker`, repository `opentine-tui`,
  #      workflow `publish.yml`, environment `pypi`.
  #   2. In this repository's settings, create an environment named `pypi`
  #      (add required reviewers there if you want a manual gate on releases).
  # No API token is stored anywhere: publishing authenticates with a short-lived
  # OIDC token minted for this workflow.
  publish-pypi:
    needs: release-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opentine-tui
    permissions:
      id-token: write

    steps:
      - name: Download the artifacts the release job built
        uses: actions/download-artifact@v4
        with:
          name: opentine-tui-release-artifacts
          path: dist

      - name: Drop the checksum file
        # PyPI accepts distributions only; SHA256SUMS belongs to the GitHub release.
        run: rm -f dist/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
