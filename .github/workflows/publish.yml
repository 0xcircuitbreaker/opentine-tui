name: GitHub Release Artifacts

on:
  push:
    tags:
      - "v*"

env:
  OPENTINE_GIT: "opentine @ git+https://github.com/0xcircuitbreaker/opentine.git@main"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip

      - name: Install opentine from source
        run: python -m pip install "${{ env.OPENTINE_GIT }}"

      - name: Install opentine-tui with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run fast gates
        run: |
          ruff check .
          ruff format --check .
          pytest tests -q

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist

      - name: Check package metadata
        run: twine check dist/*

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum opentine_tui-* > SHA256SUMS

      - name: Attest build provenance
        # Build provenance attestation requires a public repository (or GitHub
        # org/enterprise with the feature enabled). Skip it on private repos so the
        # release still publishes; it runs automatically once the repo is public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/opentine_tui-*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentine-tui-release-artifacts
          path: |
            dist/opentine_tui-*
            dist/SHA256SUMS

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/opentine_tui-* dist/SHA256SUMS --verify-tag --generate-notes
